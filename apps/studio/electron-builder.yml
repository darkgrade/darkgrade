appId: com.darkgrade.studio
productName: Darkgrade Studio
directories:
    output: release
files:
    - out/**
    - package.json
extraResources:
    # llama.cpp's server runs the assistant model; fetched by scripts/download-llama-server.ts
    - from: resources/llama-server
      to: llama-server
    # The Bark speech sidecar: server script and pinned requirements (the model and its code are downloaded)
    - from: resources/bark-sidecar
      to: bark-sidecar
asarUnpack:
    # node-usb ships native prebuilds that must live outside the asar
    - '**/node_modules/usb/**'
mac:
    category: public.app-category.photography
    icon: build/icon.icns
    # Without the audio-input entitlement the hardened runtime silently refuses the microphone
    hardenedRuntime: true
    entitlements: entitlements.mac.plist
    entitlementsInherit: entitlements.mac.plist
    target:
        - dmg
        - zip
    extendInfo:
        NSMicrophoneUsageDescription: Darkgrade Studio uses the microphone for live transcription, which runs on this Mac. Audio never leaves your Mac.
npmRebuild: false
