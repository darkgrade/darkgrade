appId: com.darkgrade.studio
productName: Darkgrade Studio
directories:
    output: release
files:
    - out/**
    - package.json
extraResources:
    # llama.cpp's server runs the local speech model; fetched by scripts/download-llama-server.ts
    - from: resources/llama-server
      to: llama-server
asarUnpack:
    # node-usb ships native prebuilds that must live outside the asar
    - '**/node_modules/usb/**'
mac:
    category: public.app-category.photography
    icon: build/icon.icns
    target:
        - dmg
        - zip
    extendInfo:
        NSMicrophoneUsageDescription: Darkgrade Studio uses the microphone for live transcription, which runs on this Mac. Audio never leaves your Mac.
npmRebuild: false
