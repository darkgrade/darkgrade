appId: com.darkgrade.studio
productName: Darkgrade Studio
directories:
    output: release
files:
    - out/**
    - package.json
extraResources:
    # llama.cpp's server runs the assistant model; fetched by scripts/download-llama-server.ts
    - from: resources/llama-server
      to: llama-server
    # The Bark speech sidecar: server script and pinned requirements (the model and its code are downloaded)
    - from: resources/bark-sidecar
      to: bark-sidecar
    # Developer Mode's vision sidecar (Depth Pro 2, SAM 3): server script and pinned requirements (models are downloaded)
    - from: resources/vision-sidecar
      to: vision-sidecar
    # The Metal live-view decoder (macOS, Developer Mode), built by scripts/build-native.mjs; optional at runtime
    - from: native/build
      to: native
      filter:
          - '*.node'
asarUnpack:
    # node-usb ships native prebuilds that must live outside the asar
    - '**/node_modules/usb/**'
    # EXPERIMENT(usb-transport): node-usb-rs (the usb package, version 3) and its prebuilt add-ons
    - '**/node_modules/usb-rs/**'
    - '**/node_modules/@node-usb/**'
mac:
    category: public.app-category.photography
    icon: build/icon.icns
    # Without the audio-input entitlement the hardened runtime silently refuses the microphone
    hardenedRuntime: true
    entitlements: entitlements.mac.plist
    entitlementsInherit: entitlements.mac.plist
    target:
        - dmg
        - zip
    extendInfo:
        NSMicrophoneUsageDescription: Darkgrade Studio uses the microphone for live transcription, which runs on this Mac. Audio never leaves your Mac.
npmRebuild: false
