name: Deploy telemetry
on:
    workflow_dispatch:
permissions:
    contents: read
    id-token: write
concurrency:
    group: telemetry-deployment
    cancel-in-progress: false
jobs:
    deploy:
        environment: telemetry
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            PROJECT: ${{ vars.TELEMETRY_PROJECT }}
            REGION: ${{ vars.TELEMETRY_REGION }}
            PUBLIC_URL: ${{ vars.TELEMETRY_PUBLIC_URL }}
            WIF_PROVIDER: ${{ vars.TELEMETRY_WIF_PROVIDER }}
            DEPLOY_ACCOUNT: ${{ vars.TELEMETRY_DEPLOY_ACCOUNT }}
        steps:
            - name: Check deployment configuration
              run: |
                  set -euo pipefail
                  for name in PROJECT REGION PUBLIC_URL WIF_PROVIDER DEPLOY_ACCOUNT; do
                      if [ -z "${!name}" ]; then
                          echo "::error::Missing telemetry deployment configuration: $name"
                          exit 1
                      fi
                  done
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: npm run test:contribute --prefix packages/slate && npm run test:telemetry --prefix packages/slate
            - uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ env.WIF_PROVIDER }}
                  service_account: ${{ env.DEPLOY_ACCOUNT }}
            - uses: google-github-actions/setup-gcloud@v2
            - name: Publish reviewed image
              run: |
                  set -euo pipefail
                  REGISTRY="$REGION-docker.pkg.dev/$PROJECT/darkgrade-telemetry"
                  IMAGE="$REGISTRY/collector:$GITHUB_SHA"
                  gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
                  docker build -f packages/slate/telemetry/Dockerfile -t "$IMAGE" .
                  docker push "$IMAGE"
                  DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
                  test -n "$DIGEST"
                  echo "TELEMETRY_IMAGE=$REGISTRY/collector@$DIGEST" >> "$GITHUB_ENV"
            - name: Update telemetry service
              run: |
                  set -euo pipefail
                  gcloud run services update darkgrade-telemetry --project="$PROJECT" --region="$REGION" --image="$TELEMETRY_IMAGE" --quiet
            - name: Verify public service
              run: |
                  set -euo pipefail
                  TELEMETRY_SMOKE_URL="$PUBLIC_URL" npm run telemetry:smoke --prefix packages/slate
                  echo "Verified image: $TELEMETRY_IMAGE" >> "$GITHUB_STEP_SUMMARY"
